<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume PDF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="resume-print.css">
</head>
<body>
  <main class="print-shell">
    <div class="print-toolbar">
      <p id="printStatus">Preparing your resume...</p>
      <button type="button" id="printButton">Print / Save as PDF</button>
    </div>
    <article id="resumeSheet" class="resume-sheet" aria-label="Resume preview"></article>
  </main>
  <script src="resume-print.js"></script>
</body>
</html>
